<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- TUNKOW — Andean Basalt Monolith & Cinnabar Mineral Inlay Edition -->
  <defs>
    <!-- Basalt Stone Texture Filter -->
    <filter id="basalt-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" result="stoneGrain" />
      <feDiffuseLighting in="stoneGrain" lighting-color="#ffffff" surfaceScale="2.5" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <!-- Deep Inlaid Chisel Shadow -->
    <filter id="chisel-depth">
      <feDropShadow dx="-2" dy="-2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Volcanic Basalt Stone Tablet -->
  <rect x="20" y="20" width="360" height="360" rx="32" fill="#18191D" stroke="#25272D" stroke-width="6" filter="url(#basalt-texture)" />

  <g filter="url(#chisel-depth)">
    <!-- Carved Andean Circular Sanctuary Rim -->
    <circle cx="200" cy="195" r="148" fill="none" stroke="#2B2E36" stroke-width="12" />
    <circle cx="200" cy="195" r="136" fill="none" stroke="#D81616" stroke-width="4" stroke-dasharray="8 6 16 6" />

    <!-- Tunqui Bulbous Crest Inlaid with Radiant Cinnabar Vermilion -->
    <path d="M 196,88 
             C 248,88 288,122 298,172 
             C 306,216 280,256 238,272 
             C 196,290 148,278 124,242 
             C 98,206 104,154 134,116 
             C 152,94 174,88 196,88 Z" 
          fill="#D81616" 
          stroke="#9E0F0F" 
          stroke-width="5" />

    <!-- Monolithic Stepped Feather Carvings (Tiwanaku / Chavín Architectural Grooves) -->
    <g stroke="#18191D" stroke-width="6" stroke-linecap="square" fill="none">
      <path d="M 196,104 L 192,168" />
      <path d="M 226,112 L 210,178" />
      <path d="M 252,128 L 228,192" />
      <path d="M 270,154 L 242,208" />
      <path d="M 276,188 L 250,224" />
      <path d="M 266,222 L 244,240" />
    </g>

    <!-- Chiseled Andean Bird Eye: Golden Sun Pupil & Obsidian Ring -->
    <circle cx="164" cy="174" r="20" fill="#18191D" stroke="#25272D" stroke-width="3" />
    <circle cx="164" cy="174" r="13" fill="#E5A93C" />
    <circle cx="164" cy="174" r="6" fill="#18191D" />

    <!-- Chiseled Horn Beak (Basalt Wedge) -->
    <polygon points="214,172 334,198 212,228" fill="#F4EDE0" stroke="#18191D" stroke-width="5" />
    <line x1="214" y1="198" x2="318" y2="198" stroke="#18191D" stroke-width="4" />

    <!-- Stepped Sacred Chakana Base Plinth -->
    <polygon points="120,248 150,248 150,270 180,270 180,292 210,292 210,314 120,314" fill="#F4EDE0" stroke="#18191D" stroke-width="4" />
    
    <!-- Inscribed Andean Runes / TUNKOW Monolith Glyph -->
    <text x="200" y="356" text-anchor="middle" font-family="'Space Grotesk', monospace" font-weight="800" font-size="14" letter-spacing="12" fill="#888F9E">T U N K O W</text>
  </g>
</svg>
